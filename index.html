<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>studithme</title>
  <meta name="description" content="화학 · 물리 · 프로그래밍 공부 허브. 과목을 고르면 새 탭에서 엽니다.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/hub.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d6e6e'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='%23f4fafa' font-size='14' font-family='Georgia,serif'%3Es%3C/text%3E%3C/svg%3E">
</head>
<body>
  <main class="shell gate-shell">
    <header class="gate-head">
      <h1 class="brand">studithme</h1>
      <p class="lead">과목을 고르면 새 탭에서 각 사이트가 열립니다 · 가로로 올려보세요</p>
    </header>

    <div class="continue" data-continue hidden>
      <a class="continue-link" data-continue-link href="#" target="_blank" rel="noopener">
        이어서 공부하기
        <small data-continue-label></small>
      </a>
    </div>

    <div class="split" data-split>
      <a
        class="pane chem"
        href="chemistry/"
        target="_blank"
        rel="noopener"
        data-side="chem"
        data-subject="chemistry"
        data-label="화학"
      >
        <span class="pane-label">화학</span>
        <span class="pane-en">Chemistry</span>
        <span class="pane-range">BS119 · 개념 · 문제 · 요약</span>
        <span class="pane-cta">열기 →</span>
      </a>
      <div class="divider" aria-hidden="true"></div>
      <a
        class="pane phys"
        href="physics/"
        target="_blank"
        rel="noopener"
        data-side="phys"
        data-subject="physics"
        data-label="물리"
      >
        <span class="pane-label">물리</span>
        <span class="pane-en">Physics</span>
        <span class="pane-range">GP2 · 중간·기말 · 개념·문제</span>
        <span class="pane-cta">열기 →</span>
      </a>
      <div class="divider" aria-hidden="true"></div>
      <a
        class="pane prog"
        href="programming/"
        target="_blank"
        rel="noopener"
        data-side="prog"
        data-subject="programming"
        data-label="프로그래밍"
      >
        <span class="pane-label">프로그래밍</span>
        <span class="pane-en">Programming</span>
        <span class="pane-range">Python · day 1–4 · 검색</span>
        <span class="pane-cta">열기 →</span>
      </a>
    </div>

    <p class="foot">개인 학습용 허브 · 브라우저에 최근 과목·문제 위치를 기억합니다.</p>
  </main>
  <script src="js/hub.js"></script>
</body>
</html>
