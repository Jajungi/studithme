<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>studithme</title>
  <meta name="description" content="화학·물리·프로그래밍을 고른 뒤 중간·기말 트랙으로 들어갑니다.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/hub.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d6e6e'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='%23f4fafa' font-size='14' font-family='Georgia,serif'%3Es%3C/text%3E%3C/svg%3E">
</head>
<body>
  <main class="shell gate-shell" data-hub>
    <header class="gate-head">
      <h1 class="brand">studithme</h1>
      <p class="lead" data-lead>먼저 과목을 고르세요 · 가로로 올려보세요</p>
    </header>

    <div class="continue" data-continue hidden>
      <a class="continue-link" data-continue-link href="#" target="_blank" rel="noopener">
        이어서 공부하기
        <small data-continue-label></small>
      </a>
    </div>

    <!-- Step 1: subjects -->
    <div class="step-subjects" data-step="subjects">
      <div class="split split-subjects" data-split-subjects>
        <button type="button" class="pane chem" data-side="chem" data-pick-subject="chemistry" data-label="화학">
          <span class="pane-label">화학</span>
          <span class="pane-en">Chemistry</span>
          <span class="pane-range">BS119</span>
          <span class="pane-cta">중간 / 기말 →</span>
        </button>
        <div class="divider" aria-hidden="true"></div>
        <button type="button" class="pane phys" data-side="phys" data-pick-subject="physics" data-label="물리">
          <span class="pane-label">물리</span>
          <span class="pane-en">Physics</span>
          <span class="pane-range">GP2</span>
          <span class="pane-cta">중간 / 기말 →</span>
        </button>
        <div class="divider" aria-hidden="true"></div>
        <button type="button" class="pane prog" data-side="prog" data-pick-subject="programming" data-label="프로그래밍">
          <span class="pane-label">프로그래밍</span>
          <span class="pane-en">Programming</span>
          <span class="pane-range">Python · 기존 사이트</span>
          <span class="pane-cta">중간 / 기말 →</span>
        </button>
      </div>
    </div>

    <!-- Step 2: term (hidden until subject chosen) -->
    <div class="step-term" data-step="term" hidden>
      <div class="term-bar">
        <button type="button" class="back-term" data-back-subject>← 과목</button>
        <span class="subject-chip" data-subject-chip></span>
      </div>
      <div class="split split-term" data-split>
        <a
          class="pane mid"
          href="#"
          target="_blank"
          rel="noopener"
          data-side="mid"
          data-pick-term="mid"
        >
          <span class="pane-label">중간</span>
          <span class="pane-en">Midterm</span>
          <span class="pane-range" data-range-mid>중간고사 범위</span>
          <span class="pane-cta">열기 →</span>
        </a>
        <div class="divider" aria-hidden="true"></div>
        <a
          class="pane final"
          href="#"
          target="_blank"
          rel="noopener"
          data-side="final"
          data-pick-term="final"
        >
          <span class="pane-label">기말</span>
          <span class="pane-en">Final</span>
          <span class="pane-range" data-range-final>기말고사 범위</span>
          <span class="pane-cta">열기 →</span>
        </a>
      </div>
    </div>

    <p class="foot">개인 학습용 허브 · 프로그래밍은 중간·기말 모두 같은 사이트로 연결됩니다.</p>
  </main>
  <script src="js/hub.js"></script>
</body>
</html>
