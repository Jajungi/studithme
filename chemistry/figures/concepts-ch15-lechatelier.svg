<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 210" role="img" aria-label="Le Chatelier · stress → shift">
  <rect width="500" height="210" fill="#fafafa"/>
  <text x="250" y="22" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="13" fill="#111">Le Chatelier · stress → shift</text>

  <rect x="40" y="50" width="120" height="90" rx="8" fill="#fde8d8" stroke="#111"/><text x="100" y="100" text-anchor="middle" font-size="12">add reactant</text>
  <rect x="190" y="50" width="120" height="90" rx="8" fill="#dceef8" stroke="#111"/><text x="250" y="100" text-anchor="middle" font-size="12">raise T / P</text>
  <rect x="340" y="50" width="120" height="90" rx="8" fill="#eee" stroke="#111"/><text x="400" y="100" text-anchor="middle" font-size="12">catalyst</text>
