<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" role="img" aria-label="Linear plots by order">
  <rect width="560" height="230" fill="#fafafa"/>
  <text x="280" y="22" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="13" fill="#111">Linear plots by order</text>

  <g transform="translate(20,40)"><rect width="160" height="150" fill="#fff" stroke="#e5e5e5"/>
  <text x="80" y="18" text-anchor="middle" font-size="11">zero · [A] vs t</text>
  <line x1="30" y1="40" x2="130" y2="120" stroke="#0d6e6e" stroke-width="2.5"/></g>
  <g transform="translate(200,40)"><rect width="160" height="150" fill="#fff" stroke="#e5e5e5"/>
  <text x="80" y="18" text-anchor="middle" font-size="11">1st · ln[A] vs t</text>
  <line x1="30" y1="45" x2="130" y2="115" stroke="#0d6e6e" stroke-width="2.5"/></g>
  <g transform="translate(380,40)"><rect width="160" height="150" fill="#fff" stroke="#e5e5e5"/>
  <text x="80" y="18" text-anchor="middle" font-size="11">2nd · 1/[A] vs t</text>
  <line x1="30" y1="115" x2="130" y2="40" stroke="#0d6e6e" stroke-width="2.5"/></g>

</svg>
