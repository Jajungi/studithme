<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" role="img" aria-label="Like dissolves like">
  <rect width="500" height="220" fill="#fafafa"/>
  <text x="250" y="22" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="13" fill="#111">Like dissolves like</text>

  <rect x="40" y="50" width="190" height="140" rx="10" fill="#fff" stroke="#111"/>
  <text x="135" y="80" text-anchor="middle" font-size="13" font-weight="700">polar / ionic</text>
  <circle cx="100" cy="130" r="20" fill="#3a7bd5"/><text x="100" y="134" text-anchor="middle" font-size="10" fill="#fff">δ+</text>
  <circle cx="170" cy="130" r="20" fill="#e85d4c"/><text x="170" y="134" text-anchor="middle" font-size="10" fill="#fff">δ−</text>
  <text x="135" y="175" text-anchor="middle" font-size="11" fill="#0d6e6e">H2O · alcohol · salt</text>
  <rect x="270" y="50" width="190" height="140" rx="10" fill="#fff" stroke="#111"/>
  <text x="365" y="80" text-anchor="middle" font-size="13" font-weight="700">nonpolar</text>
  <circle cx="330" cy="130" r="18" fill="#bbb"/><circle cx="400" cy="130" r="18" fill="#bbb"/>
  <text x="365" y="175" text-anchor="middle" font-size="11" fill="#0d6e6e">hexane · oil · CCl4</text>

</svg>
