<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" role="img" aria-label="Why the ½ factor?">
  <rect width="420" height="200" fill="#fafafa"/>
  <text x="210" y="22" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="13" fill="#111">Why the ½ factor?</text>

  <text x="210" y="80" text-anchor="middle" font-size="14">U = ½ Σ qi Vi</text>
  <text x="210" y="120" text-anchor="middle" font-size="12" fill="#555">each pair counted twice in Σ qiVi</text>
  <text x="210" y="155" text-anchor="middle" font-size="12">also U = ½ Q V for a capacitor</text>

</svg>
