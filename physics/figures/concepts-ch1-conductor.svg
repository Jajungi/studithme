<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" role="img" aria-label="Conductor vs insulator">
  <rect width="420" height="210" fill="#fafafa"/>
  <text x="210" y="22" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="13" fill="#111">Conductor vs insulator</text>

  <rect x="50" y="55" width="140" height="110" rx="8" fill="#dceef8" stroke="#111"/>
  <text x="120" y="100" text-anchor="middle" font-size="13">conductor</text>
  <text x="120" y="125" text-anchor="middle" font-size="11" fill="#555">free charges</text>
  <rect x="230" y="55" width="140" height="110" rx="8" fill="#fde8d8" stroke="#111"/>
  <text x="300" y="100" text-anchor="middle" font-size="13">insulator</text>
  <text x="300" y="125" text-anchor="middle" font-size="11" fill="#555">charges stuck</text>

</svg>
