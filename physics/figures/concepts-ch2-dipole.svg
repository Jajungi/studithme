<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" role="img" aria-label="Dipole in uniform E">
  <rect width="420" height="230" fill="#fafafa"/>
  <text x="210" y="22" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="13" fill="#111">Dipole in uniform E</text>

  <g stroke="#e67e22" stroke-width="1.5">
  <line x1="50" y1="60" x2="370" y2="60"/><line x1="50" y1="100" x2="370" y2="100"/>
  <line x1="50" y1="140" x2="370" y2="140"/><line x1="50" y1="180" x2="370" y2="180"/>
  </g>
  <circle cx="170" cy="120" r="12" fill="#e85d4c"/><text x="170" y="124" text-anchor="middle" font-size="10" fill="#fff">+</text>
  <circle cx="250" cy="120" r="12" fill="#3a7bd5"/><text x="250" y="124" text-anchor="middle" font-size="10" fill="#fff">−</text>
  <line x1="170" y1="120" x2="250" y2="120" stroke="#111" stroke-width="2"/>
  <text x="210" y="110" text-anchor="middle" font-size="12">p</text>
  <text x="210" y="215" text-anchor="middle" font-size="12">τ = p × E · U = −p·E</text>

</svg>
